<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Pritam Rajput, full-stack engineer, founder of Record10">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141b34"/></linearGradient>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4285F4"/><stop offset=".35" stop-color="#34A853"/><stop offset=".7" stop-color="#FBBC05"/><stop offset="1" stop-color="#EA4335"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity=".07"/></pattern>
  <clipPath id="c"><rect width="900" height="250" rx="22"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="900" height="250" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".75">
    <circle cx="120" cy="70" r="70" fill="#4285F4"><animateTransform attributeName="transform" type="translate" values="0 0;60 30;0 0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="60" r="62" fill="#EA4335"><animateTransform attributeName="transform" type="translate" values="0 0;-50 40;0 0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="250" r="66" fill="#FBBC05"><animateTransform attributeName="transform" type="translate" values="0 0;40 -30;0 0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="230" r="54" fill="#34A853"><animateTransform attributeName="transform" type="translate" values="0 0;-40 -20;0 0" dur="12s" repeatCount="indefinite"/></circle>
  </g>
  <rect width="900" height="250" fill="url(#dots)"/>
  <rect y="244" width="900" height="6" fill="url(#g)"/>
</g>
<text x="52" y="108" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-1">Pritam Rajput</text>
<text x="54" y="148" fill="#c7d2fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="500">Full-stack engineer  ·  Founder of Record10</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
  <rect x="52" y="178" width="196" height="34" rx="17" fill="#4285F4" fill-opacity=".18" stroke="#4285F4" stroke-opacity=".7"/>
  <circle cx="72" cy="195" r="5" fill="#4285F4"/><text x="86" y="200" fill="#dbe7ff">Googlers org member</text>
  <rect x="262" y="178" width="152" height="34" rx="17" fill="#34A853" fill-opacity=".18" stroke="#34A853" stroke-opacity=".7"/>
  <circle cx="282" cy="195" r="5" fill="#34A853"/><text x="296" y="200" fill="#d6f5df">Record10 founder</text>
  <rect x="428" y="178" width="150" height="34" rx="17" fill="#FBBC05" fill-opacity=".16" stroke="#FBBC05" stroke-opacity=".7"/>
  <circle cx="448" cy="195" r="5" fill="#FBBC05"/><text x="462" y="200" fill="#fff0bf">Pune, India</text>
</g>
</svg>