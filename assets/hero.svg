<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" width="640" height="236" role="img" aria-label="Pritam Rajput, full-stack engineer, founder of Record10">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141b34"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4285F4"/><stop offset=".35" stop-color="#34A853"/><stop offset=".7" stop-color="#FBBC05"/><stop offset="1" stop-color="#EA4335"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".07"/></pattern>
  <clipPath id="c"><rect width="640" height="236" rx="20"/></clipPath></defs>
<g clip-path="url(#c)">
  <rect width="640" height="236" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".75">
    <circle cx="90" cy="60" r="56" fill="#4285F4"><animateTransform attributeName="transform" type="translate" values="0 0;45 24;0 0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="50" r="50" fill="#EA4335"><animateTransform attributeName="transform" type="translate" values="0 0;-36 30;0 0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="236" r="52" fill="#FBBC05"><animateTransform attributeName="transform" type="translate" values="0 0;30 -24;0 0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="214" r="44" fill="#34A853"><animateTransform attributeName="transform" type="translate" values="0 0;-30 -16;0 0" dur="12s" repeatCount="indefinite"/></circle>
  </g>
  <rect width="640" height="236" fill="url(#dots)"/>
  <rect y="230" width="640" height="6" fill="url(#g)"/>
</g>
<text x="36" y="92" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="-1">Pritam Rajput</text>
<text x="38" y="128" fill="#c7d2fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="500">Full-stack engineer  ·  Founder of Record10</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">
  <rect x="36" y="156" width="186" height="34" rx="17" fill="#4285F4" fill-opacity=".18" stroke="#4285F4" stroke-opacity=".7"/>
  <circle cx="55" cy="173" r="5" fill="#4285F4"/><text x="68" y="178" fill="#dbe7ff">Googlers org member</text>
  <rect x="232" y="156" width="164" height="34" rx="17" fill="#34A853" fill-opacity=".18" stroke="#34A853" stroke-opacity=".7"/>
  <circle cx="251" cy="173" r="5" fill="#34A853"/><text x="264" y="178" fill="#d6f5df">Record10 founder</text>
  <rect x="406" y="156" width="118" height="34" rx="17" fill="#FBBC05" fill-opacity=".16" stroke="#FBBC05" stroke-opacity=".7"/>
  <circle cx="425" cy="173" r="5" fill="#FBBC05"/><text x="438" y="178" fill="#fff0bf">Pune, India</text>
</g></svg>